<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b6b4a"/>
      <stop offset="100%" style="stop-color:#6f4e37"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Coffee cup -->
  <g fill="#f8f6f3">
    <!-- Cup body -->
    <path d="M128 180 h200 v20 c0 100 -20 180 -100 180 s-100 -80 -100 -180 v-20 z"/>
    
    <!-- Cup handle -->
    <path d="M328 200 c40 0 60 30 60 70 s-20 70 -60 70 h-10 v-30 h10 c20 0 30 -15 30 -40 s-10 -40 -30 -40 h-10 v-30 h10 z"/>
    
    <!-- Saucer -->
    <ellipse cx="228" cy="400" rx="130" ry="25"/>
    
    <!-- Steam lines -->
    <path d="M180 100 q10 -30 0 -50 q-10 -20 0 -40" fill="none" stroke="#f8f6f3" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <path d="M228 90 q10 -25 0 -45 q-10 -20 0 -35" fill="none" stroke="#f8f6f3" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <path d="M276 100 q10 -30 0 -50 q-10 -20 0 -40" fill="none" stroke="#f8f6f3" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- Coffee bean accent -->
  <g transform="translate(360, 320) rotate(30)">
    <ellipse cx="0" cy="0" rx="35" ry="50" fill="#d4a574"/>
    <path d="M0 -40 c-10 20 -10 60 0 80" fill="none" stroke="#6f4e37" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
